name: Node.js CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.22.1
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - run: npm ci
      - run: npm run build
      - run: npm run test
        env:
          CI: true

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 24.22.1
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - run: npm ci
      - run: npm run lint:ci

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Build docker image
        run: docker build -t relekang/graphql-rss-parser:${{ github.sha }} .
